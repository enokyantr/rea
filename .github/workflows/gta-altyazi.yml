name: GTA Altyazi Windows build

on:
  push:
    branches: [claude/gta6-auto-subtitle-tool-9uumiv]
    paths:
      - gta-altyazi/**
      - .github/workflows/gta-altyazi.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta-altyazi-${{ github.ref }}
  cancel-in-progress: true

env:
  # Paketlenecek yerel çeviri modeli (taslak çeviri). Karşılaştırma için ikinci model de ölçülür.
  MT_MODEL: Helsinki-NLP/opus-mt-tc-big-en-tr
  # Yalnızca karşılaştırma için; bulunamazsa atlanır.
  MT_MODEL_ALT: Helsinki-NLP/opus-mt-tc-base-en-tr

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: gta-altyazi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-gpu.txt pytest pyinstaller

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Convert translation models to CTranslate2
        run: |
          # Dönüştürme araçları (torch/transformers) ayrı ortamda: exe'ye girmesinler.
          python -m venv ../convenv
          ../convenv/Scripts/python -m pip install --quiet ctranslate2 sentencepiece transformers
          ../convenv/Scripts/python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          ../convenv/Scripts/ct2-transformers-converter --model $env:MT_MODEL --output_dir ../mt/main `
            --quantization int8 --copy_files source.spm target.spm
          ../convenv/Scripts/ct2-transformers-converter --model $env:MT_MODEL_ALT --output_dir ../mt/alt `
            --quantization int8 --copy_files source.spm target.spm
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Karşılaştırma modeli dönüştürülemedi: $env:MT_MODEL_ALT" }
          $global:LASTEXITCODE = 0
          Get-ChildItem ../mt -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Ensure English OCR language
        continue-on-error: true
        run: |
          $cap = Get-WindowsCapability -Online -Name "Language.OCR~~~en-US~0.0.1.0"
          Write-Host "OCR en-US: $($cap.State)"
          if ($cap.State -ne "Installed") {
            Add-WindowsCapability -Online -Name "Language.OCR~~~en-US~0.0.1.0"
          }

      - name: Build GTA-Altyazi.exe
        run: |
          $cublas = python -c "import nvidia.cublas, os; print(os.path.join(list(nvidia.cublas.__path__)[0], 'bin'))"
          python -m PyInstaller --noconfirm --clean --onedir --console --name GTA-Altyazi `
            --collect-all winrt --collect-all ctranslate2 --collect-binaries sentencepiece `
            --add-binary "$cublas/cublas64_12.dll;nvidia/cublas/bin" `
            --add-binary "$cublas/cublasLt64_12.dll;nvidia/cublas/bin" `
            gta_altyazi.py
          Copy-Item -Recurse ../mt/main dist/GTA-Altyazi/model
          Copy-Item README.md dist/GTA-Altyazi/BENIOKU.md
          Compress-Archive -Path dist/GTA-Altyazi -DestinationPath dist/GTA-Altyazi-windows.zip
          "{0:N0} MB" -f ((Get-Item dist/GTA-Altyazi-windows.zip).Length / 1MB)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GTA-Altyazi-windows
          path: gta-altyazi/dist/GTA-Altyazi-windows.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Local translation quality and speed (built exe, CPU runner)
        run: |
          Write-Host "=== $env:MT_MODEL (paketlenen) ==="
          ./dist/GTA-Altyazi/GTA-Altyazi.exe --mt-bench
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path ../mt/alt/model.bin) {
            '{"local_model_dir": "' + ((Resolve-Path ../mt/alt) -replace '\\', '/') + '"}' | Set-Content alt.json
            Write-Host "=== $env:MT_MODEL_ALT ==="
            ./dist/GTA-Altyazi/GTA-Altyazi.exe --mt-bench --config alt.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Self-test of the built exe (real Windows OCR, overlay, capture exclusion)
        run: |
          ./dist/GTA-Altyazi/GTA-Altyazi.exe --list-windows
          ./dist/GTA-Altyazi/GTA-Altyazi.exe --self-test --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
