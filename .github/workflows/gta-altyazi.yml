name: GTA Altyazi Windows build

on:
  push:
    branches: [claude/gta6-auto-subtitle-tool-9uumiv]
    paths:
      - gta-altyazi/**
      - .github/workflows/gta-altyazi.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta-altyazi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: gta-altyazi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Ensure English OCR language
        continue-on-error: true
        run: |
          $cap = Get-WindowsCapability -Online -Name "Language.OCR~~~en-US~0.0.1.0"
          Write-Host "OCR en-US: $($cap.State)"
          if ($cap.State -ne "Installed") {
            Add-WindowsCapability -Online -Name "Language.OCR~~~en-US~0.0.1.0"
          }

      - name: Build GTA-Altyazi.exe
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console `
            --name GTA-Altyazi --collect-all winrt gta_altyazi.py
          Copy-Item README.md dist/GTA-Altyazi/BENIOKU.md
          Compress-Archive -Path dist/GTA-Altyazi -DestinationPath dist/GTA-Altyazi-windows.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GTA-Altyazi-windows
          path: gta-altyazi/dist/GTA-Altyazi-windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Self-test of the built exe (real Windows OCR, overlay, capture exclusion)
        run: |
          ./dist/GTA-Altyazi/GTA-Altyazi.exe --list-windows
          ./dist/GTA-Altyazi/GTA-Altyazi.exe --self-test --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
